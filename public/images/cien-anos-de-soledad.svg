<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3c72"/>
      <stop offset="1" stop-color="#2a5298"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#cover)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <text x="200" y="270" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-weight="bold" font-size="30">
    <tspan x="200" dy="0">Cien años</tspan>
    <tspan x="200" dy="38">de soledad</tspan>
  </text>
  <text x="200" y="480" text-anchor="middle" fill="#c8d6e5" font-family="Arial, sans-serif" font-size="18">
    Gabriel García Márquez
